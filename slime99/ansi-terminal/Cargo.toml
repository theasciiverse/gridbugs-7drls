[package]
name = "slime99_ansi_terminal"
version = "0.1.0"
authors = ["Stephen Sherratt <stephen@sherra.tt>"]
edition = "2018"

[features]
# Music and sound effects. The Asciiverse build leaves them out (--no-default-features).
default = ["sound"]
sound = ["slime99_native/sound"]

[dependencies]
slime99_native = { path = "../native", default-features = false }
slime99_app = { path = "../app", default-features = false }
log = "0.4"
env_logger = "0.8"
rand = "0.8"
chargrid_ansi_terminal = { version = "0.2", features = ["gamepad"] }
