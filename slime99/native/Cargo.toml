[package]
name = "slime99_native"
version = "0.1.0"
authors = ["Stephen Sherratt <stephen@sherra.tt>"]
edition = "2018"

[features]
# Audio through the system's sound device; without it the game is silent.
default = ["sound"]
sound = ["general_audio_static/native", "general_audio_static/native_vorbis", "slime99_app/native_sound"]
force_dedicated_audio_thread = ["sound", "general_audio_static/native_force_dedicated_audio_thread"]

[dependencies]
slime99_app = { path = "../app", default-features = false, features = ["native"] }
log = "0.4"
meap = "0.4"
serde_json = "1.0"
general_storage_static = { version = "0.1", features = ["file"] }
general_audio_static = "0.3"
