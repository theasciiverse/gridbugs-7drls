# Asciiverse release workflow (tag v* or run by hand with a tag)
# Builds the terminal edition of each of gridbugs' 7DRLs in this repo and
# packs one archive per game per target, named <id>-<target>.tar.gz, plus a
# SHA256SUMS file, attached to one GitHub release; each game is its own
# catalog title in the gridbugs-7drls collection, reading its own archives
# (hub/catalog/SCHEMA.md). The games and their cargo flags are listed in
# asciiverse/games.txt; asciiverse/package.sh does the building and packing
# here and on a developer's machine alike.
#
# Linux and macOS only: the games' terminal frontend (chargrid's ANSI
# terminal context) talks to the terminal through termios, which Windows
# does not have. Linux builds are glibc, built on Ubuntu 22.04 (glibc 2.35
# and newer): the gamepad support links libudev, and Electric Organ's
# synthesised music plays through ALSA, so the binaries need libudev1 and,
# for Electric Organ, libasound2 (the manifests' system_deps).

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to build and release"
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-22.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build and pack
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev pkg-config
          rustup update stable && rustup default stable
          JOBS=4 asciiverse/package.sh ${{ matrix.target }}
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz

  macos:
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-apple-darwin, aarch64-apple-darwin]
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build and pack
        run: |
          rustup update stable && rustup default stable
          rustup target add ${{ matrix.target }}
          CARGO_BUILD_TARGET=${{ matrix.target }} JOBS=4 asciiverse/package.sh ${{ matrix.target }}
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz

  release:
    needs: [linux, macos]
    if: ${{ !cancelled() && needs.linux.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "gridbugs' 7DRLs $TAG" \
                 --notes "Stephen Sherratt's (gridbugs) seven-day roguelikes in their terminal editions: Orbital Decay, Boat Journey, slime99, Electric Organ, Road Closed, Rain Forest and Meters Below the Ground. One archive per game per platform, Linux and macOS. MIT. Changes: see PATCHES.md."
          gh release upload "$TAG" dist/* -R "$GITHUB_REPOSITORY" --clobber
